[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "super-computer-agent"
version = "1.0.0"
description = "Screenshot + UI Automation tree + live pixel grid + FOVEA content-addressed screen memory, as one observation-only MCP server for Windows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.4",
    "mss>=9.0",
    "mcp>=1.2,<2",
    "pywinauto==0.6.9; sys_platform == 'win32'",
    "uiautomation>=2.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
super-computer-agent = "super_computer_agent.cli:main"
sca = "super_computer_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
super_computer_agent = ["py.typed"]
"super_computer_agent.plugins._compiled" = ["*.pyd", "*.so"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: needs a real desktop session (set SCA_INTEGRATION=1)"]
